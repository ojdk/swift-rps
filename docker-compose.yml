services:
  corebook:
    build:
      context: . # Root directory of your project
      dockerfile: ./Docker/CoreBook/CoreBook.Dockerfile # Or the path to your CoreBook Dockerfile
    container_name: corebook_service
    # restart: unless-stopped # Optional: restart policy
    ports:
      - "8080:8080" # host:container
    networks:
      - app_network
    # environment: # Pass environment variables
    # - MY_CONFIG_VALUE=some_value

  playerbook:
    build:
      context: . # Root directory of your project
      dockerfile: ./Docker/PlayerBook/PlayerBook.Dockerfile # Or the path to your PlayerBook Dockerfile
    container_name: playerbook_service
    # restart: unless-stopped # Optional: restart policy
    ports:
      - "8082:8080" # host:container
    networks:
      - app_network
    # environment: # Pass environment variables
    # - MY_CONFIG_VALUE=some_value

  monsterbook:
    build:
      context: .
      dockerfile: ./Docker/MonsterBook/MonsterBook.Dockerfile # Or the path to your MonsterBook Dockerfile
    container_name: monsterbook_service
    # restart: unless-stopped
    ports:
      - "8081:8080" # Maps port 8081 on your host to port 8080 in the container
    environment:
      - COREBOOK_HOSTNAME=corebook
      - COREBOOK_PORT=8080
    # - ANOTHER_CONFIG=another_value
    networks:
      - app_network
    depends_on:
      - corebook
    # Example: Adding a RabbitMQ service (if you were using it)
    # rabbitmq:
    #   image: "rabbitmq:3-management"
    #   container_name: rabbitmq_local
    #   ports:
    #     - "5672:5672" # AMQP port
    #     - "15672:15672" # Management UI port
    #   environment:
    #     - RABBITMQ_DEFAULT_USER=user
    #     - RABBITMQ_DEFAULT_PASS=password

    # You can define networks if needed, though Docker Compose creates a default one
networks:
  app_network:
    driver: bridge
